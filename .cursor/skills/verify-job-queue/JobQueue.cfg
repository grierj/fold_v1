\* Every rule, liveness included, on small bounds (about 600,000 states).
\* Three workers are enough for a lease taken back from a worker that had
\* already taken it back from another (the longest chain the fencing stops).
SPECIFICATION Spec
CONSTANTS
    Workers = {w1, w2, w3}
    NoOne = NoOne
    MaxAttempts = 2
    MaxRetries = 1
    MaxCrashes = 1
    MaxSlow = 2
    Break = "none"
INVARIANTS
    TypeOK
    AttemptsNeverNegative
    TwoRunsOnlyAfterALeaseRunsOut
    AttemptBudget
    OnDeadOncePerDeath
PROPERTIES
    FinishedStaysFinished
    RunningEnds
    WaitingIsPickedUp
