\* The safety rules on wider bounds. SYMMETRY is
\* sound for these rules but not for liveness, which JobQueue.cfg checks.
SPECIFICATION Spec
CONSTANTS
    Workers = {w1, w2, w3}
    NoOne = NoOne
    MaxAttempts = 3
    MaxRetries = 2
    MaxCrashes = 2
    MaxSlow = 3
    Break = "none"
SYMMETRY WorkerSymmetry
INVARIANTS
    TypeOK
    AttemptsNeverNegative
    TwoRunsOnlyAfterALeaseRunsOut
    AttemptBudget
    OnDeadAtMostOncePerDeath
PROPERTIES
    FinishedStaysFinished
